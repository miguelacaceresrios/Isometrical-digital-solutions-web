<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isometrical Digital Solutions</title>
<meta name="description" content="Desarrollamos sistemas web y de escritorio para negocios pequeños en Colombia.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Isometrical Digital Solutions">
<meta property="og:title" content="Isometrical Digital Solutions">
<meta property="og:description" content="Desarrollamos sistemas web y de escritorio para negocios pequeños en Colombia.">
<meta property="og:locale" content="es_CO">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Michroma&family=Outfit:wght@300;400&display=swap">
<!-- Estilos por tema; el orden importa: cada archivo puede ajustar a los anteriores -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/list.css">
<link rel="stylesheet" href="css/plans.css">
<link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="css/team.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/responsive.css">
<!-- Textos primero, la aplicación al final -->
<script src="js/content.js" defer></script>
<script src="js/dom.js" defer></script>
<script src="js/render.js" defer></script>
<script src="js/plans.js" defer></script>
<script src="js/contact.js" defer></script>
<script src="js/team.js" defer></script>
<script src="js/motion.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<div class="ids">
  <header class="top">
    <p class="brand">
      <span class="sr-only">Isometrical Digital Solutions</span>
      <span class="brand-name" aria-hidden="true">Isometrical</span>
      <span class="brand-sub" aria-hidden="true">Digital Solutions</span>
    </p>
  </header>


  <nav class="bar" aria-label="Secciones">
    <button type="button" class="cat on" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 L20.5 7.5 L20.5 16.5 L12 21.5 L3.5 16.5 L3.5 7.5 Z M3.5 7.5 L12 12.5 L20.5 7.5 M12 12.5 L12 21.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span class="lbl">Inicio</span>
    </button>
    <button type="button" class="cat" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L21 8 L12 13 L3 8 Z M3 12 L12 17 L21 12 M3 16 L12 21 L21 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span class="lbl">Servicios</span>
    </button>
    <button type="button" class="cat" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M11.28 5.24 L21.40 11.08 L21.40 16.09 L12.72 16.09 L2.60 10.25 L11.28 5.24 M2.60 10.25 L2.60 12.92 L12.72 18.76 L21.40 18.76 L21.40 16.09 M12.72 16.09 L12.72 18.76 M11.93 10.62 L10.97 10.94 L9.85 10.94 L8.89 10.62 L8.33 10.07 L8.33 9.42 L8.89 8.87 L9.85 8.55 L10.97 8.55 L11.93 8.87 L12.48 9.42 L12.48 10.07 L11.93 10.62"/></svg>
      <span class="lbl">Planes</span>
    </button>
    <button type="button" class="cat" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M12.00 4.94 L21.40 10.37 L12.00 15.80 L2.60 10.37 L12.00 4.94 M21.40 10.37 L21.40 13.63 L12.00 19.06 L2.60 13.63 L2.60 10.37 M12.00 15.80 L12.00 19.06 M16.70 7.66 L7.30 13.09 M7.30 7.66 L16.70 13.09"/></svg>
      <span class="lbl">Proyectos</span>
    </button>
    <button type="button" class="cat" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M19.98 15.87 L19.98 6.29 L16.79 8.13 L16.79 11.32 L13.60 13.17 L13.60 16.36 L10.40 18.21 L10.40 21.40 L19.98 15.87 M19.98 6.29 L13.60 2.60 L10.40 4.44 L16.79 8.13 M10.40 4.44 L10.40 7.64 M16.79 11.32 L10.40 7.64 L7.21 9.48 L13.60 13.17 M7.21 9.48 L7.21 12.68 M13.60 16.36 L7.21 12.68 L4.02 14.52 L10.40 18.21 M4.02 14.52 L4.02 17.71 M4.02 17.71 L10.40 21.40"/></svg>
      <span class="lbl">Cómo trabajamos</span>
    </button>
    <button type="button" class="cat" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M2.8 18.2 L12 22.9 L21.2 18.2"/><circle cx="9.3" cy="6" r="2.4"/><path d="M5 16.6 C5 13.4 6.9 11.1 9.3 11.1 S13.6 13.4 13.6 16.6" stroke-linecap="round"/><circle cx="15.6" cy="6.9" r="1.95"/><path d="M14.9 11 C17.1 10.9 18.9 12.7 18.9 15.4" stroke-linecap="round"/></svg>
      <span class="lbl">Equipo</span>
    </button>
    <button type="button" class="cat" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M4.38 13.82 L17.51 21.40 L17.51 11.39 L4.38 3.81 L4.38 13.82 M4.38 3.81 L6.49 2.60 L19.62 10.18 L17.51 11.39 M19.62 10.18 L19.62 20.19 L17.51 21.40 M4.38 3.81 L10.95 13.41 L17.51 11.39"/></svg>
      <span class="lbl">Contacto</span>
    </button>
  </nav>

  <main class="stage">
    <div class="list" role="group" aria-label="Inicio"></div>
    <section class="detail" aria-live="polite">
      <div class="d-avatar" id="dAvatar" hidden><img alt=""><i class="presence"></i></div>
      <p class="d-sub" id="dSub"></p>
      <h1 class="d-title" id="dTitle"></h1>
      <div class="d-body" id="dBody"></div>
      <ul class="d-features" id="dFeatures" hidden></ul>
      <p class="d-pay" id="dPay" hidden></p>
      <p class="d-status" id="dStatus" hidden></p>
      <ul class="d-points" id="dPoints" hidden></ul>
      <div id="dCta"></div>
    </section>
    <!-- Planes: tarjetas de precios lado a lado (js/plans.js) -->
    <div class="plans" id="plans" role="group" aria-label="Planes" hidden></div>
    <!-- Contacto: panel con el correo y qué contarnos (js/contact.js) -->
    <div class="contact" id="contact" hidden></div>
  </main>

  <div class="waves" aria-hidden="true">
    <svg class="w1" viewBox="0 0 2880 400" preserveAspectRatio="none">
      <path d="M0 200 C240 120 480 120 720 200 S1200 280 1440 200 S1920 120 2160 200 S2640 280 2880 200 L2880 400 L0 400 Z" fill="rgba(255,255,255,0.04)"/>
      <path d="M0 200 C240 120 480 120 720 200 S1200 280 1440 200 S1920 120 2160 200 S2640 280 2880 200" fill="none" stroke="rgba(255,255,255,0.34)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <path d="M0 214 C240 140 480 140 720 214 S1200 290 1440 214 S1920 140 2160 214 S2640 290 2880 214" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="w2" viewBox="0 0 2880 400" preserveAspectRatio="none">
      <path d="M0 230 C240 300 480 300 720 230 S1200 160 1440 230 S1920 300 2160 230 S2640 160 2880 230 L2880 400 L0 400 Z" fill="rgba(255,255,255,0.025)"/>
      <path d="M0 230 C240 300 480 300 720 230 S1200 160 1440 230 S1920 300 2160 230 S2640 160 2880 230" fill="none" stroke="rgba(255,255,255,0.17)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>
</div>
</body>
</html>
